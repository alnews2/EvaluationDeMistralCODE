name: CI/CD Pipeline - Simplified Test

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Get Poetry virtualenv path
        id: poetry-path
        run: |
          echo "path=$(poetry env info --path)" >> $GITHUB_OUTPUT

      - name: Add Poetry to PATH
        run: |
          echo "${{ steps.poetry-path.outputs.path }}/bin" >> $GITHUB_PATH

      - name: Install project with all dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: Run linting
        run: |
          poetry run ruff check --fix --unsafe-fixes src/ tests/

      - name: Run type checking
        run: |
          poetry run mypy src/ --ignore-missing-imports

      - name: Install Qt dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri libxkbcommon-x11-0 libgl1 libglx0

      - name: Run tests with coverage
        run: |
          poetry run pytest --cov=src --cov-report=xml --cov-report=term -p no:cacheprovider

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}

  build:
    name: Build for ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Get Poetry virtualenv path
        id: poetry-path
        run: |
          echo "path=$(poetry env info --path)" >> $GITHUB_OUTPUT

      - name: Add Poetry to PATH
        run: |
          echo "${{ steps.poetry-path.outputs.path }}/bin" >> $GITHUB_PATH

      - name: Install project with all dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: Build application
        run: |
          poetry run pyinstaller --name TaskMaster --windowed --onefile --clean src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: TaskMaster-${{ matrix.os }}
          path: dist/TaskMaster*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: TaskMaster v${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Nouvelle version de TaskMaster
            
            Voir [CHANGELOG.md](https://github.com/alnews2/EvaluationDeMistralCODE/blob/main/CHANGELOG.md) pour les détails.
          files: |
            artifacts/TaskMaster*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
